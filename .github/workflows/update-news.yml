name: Update News Data

# Fetches feeds, rebuilds data.json, and commits ONLY when content changed.
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay under load)
  workflow_dispatch: {}        # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/fetch-feeds.js"
      - ".github/workflows/update-news.yml"

# Never let two runs overlap and race on the commit.
concurrency:
  group: update-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --omit=dev

      - name: Fetch feeds & build data.json
        run: node scripts/fetch-feeds.js

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore(data): refresh news feed [skip ci]"
            git push
            echo "Committed updated data.json."
          else
            echo "No changes — nothing to commit."
          fi
